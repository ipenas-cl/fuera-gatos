<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1216;color:#e8eaed;font:16px system-ui,sans-serif}
form{display:grid;gap:12px;width:min(320px,90vw)}
input,button{padding:12px;border-radius:10px;border:1px solid #2b323b;background:#181d23;color:inherit;font:inherit}
button{background:#3b82f6;border:0;font-weight:600}
#e{color:#f87171;min-height:1.2em}
</style></head><body>
<form id="f"><h2>Casa</h2><input id="t" type="password" placeholder="Clave" autofocus><button>Entrar</button><div id="e"></div></form>
<script>
f.onsubmit=async e=>{e.preventDefault();
 const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({token:t.value})});
 if(r.ok)location.href='/';else document.getElementById('e').textContent='Clave incorrecta';}
</script></body></html>
