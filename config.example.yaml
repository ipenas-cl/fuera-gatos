# Configuración de fuera-gatos.
# Copiar a config.yaml y ajustar. Todas las duraciones están en segundos.

camera:
  source: picamera        # picamera | usb | rtsp | synthetic
  device: 0               # índice de la cámara USB, o URL rtsp:// si source=rtsp
  width: 640
  height: 480
  fps: 8                  # cuadros por segundo que se analizan (bajo = menos CPU)
  rotate: 0               # 0, 90, 180 o 270

detector:
  backend: yolo           # yolo (recomendado) | motion (sin red neuronal, menos preciso)
  model: yolov8n.pt       # se descarga solo la primera vez; en Pi conviene exportar a NCNN
  confidence: 0.45
  target_labels: [cat]    # qué activa el sistema
  # Si aparece alguna de estas etiquetas en el cuadro NO se activa nada
  # (evita rociar a personas o al perro de la casa).
  suppress_labels: [person, dog]
  motion:                 # solo para backend=motion
    threshold: 25         # sensibilidad al cambio de píxel (0-255)
    min_area: 1500        # área mínima del bulto en px² (descarta pájaros, hojas)
    max_area: 60000       # área máxima (descarta personas y autos)

zones:
  # Polígonos (en píxeles de la imagen) donde SÍ se actúa.
  # Lista vacía = todo el cuadro. Un gato se considera "dentro" si la base
  # de su cuadro (donde apoya las patas) cae dentro del polígono.
  # `deterrents` limita qué disuasores se pueden usar en esa zona (si se omite,
  # todos los del nivel). En un techo compartido con los vecinos: nunca agua.
  include:
    - name: basura
      polygon: [[0, 200], [300, 200], [300, 480], [0, 480]]
    - name: jardin
      polygon: [[300, 150], [640, 150], [640, 480], [300, 480]]
    - name: techo
      polygon: [[0, 0], [640, 0], [640, 150], [0, 150]]
      deterrents: [luz, ultrasonido, sonido]   # agregar torreta solo si el chorro cae en tu tramo de techo

controller:
  confirm_frames: 3            # detecciones dentro de la ventana antes de actuar
  confirm_window_s: 2.0
  cooldown_s: 15               # pausa mínima entre activaciones (corta: suelen venir varios)
  max_activations_per_hour: 20 # tope para no desperdiciar agua ni molestar vecinos
  escalate_if_return_within_s: 300  # si el gato vuelve antes de esto, sube de nivel
  # El agua es la base desde la primera visita: con gatos acostumbrados a perros,
  # púas y ultrasonido, la luz y el sonido solos no alcanzan.
  escalation:
    - name: nivel_1
      deterrents: [torreta, luz]
      duration_s: 4
    - name: nivel_2
      deterrents: [torreta, aspersor, luz, sonido]
      duration_s: 6
  quiet_hours:                 # de noche, nada de sonido audible
    start: "22:00"
    end: "07:00"
    allowed: [torreta, aspersor, luz, ultrasonido]

deterrents:
  # Torreta: chorro fino de poco caudal que sigue al gato con dos servos.
  torreta:
    type: turret
    valve_pin: 27              # relé de la bomba de 12 V (o electroválvula)
    active_high: true
    max_on_s: 8                # tope duro
    pulse_on_s: 0.6            # ráfagas: más sorpresivo y gasta la mitad de agua
    pulse_off_s: 0.3
    lead_s: 0.3                # anticipa el movimiento del gato (segundos)
    servo:
      driver: pca9685          # pca9685 (I2C, recomendado) | gpiozero (pines PWM)
      pan_channel: 0           # con gpiozero usar pan_pin / tilt_pin (BCM)
      tilt_channel: 1
    # Píxel -> grados, dos puntos por eje. Se obtienen con `fuera-gatos aim`.
    calibration:
      pan:  [[0, 150], [640, 30]]
      tilt: [[150, 75], [480, 35]]
    # Límites mecánicos: fuera de esto no apunta nunca (calle, vereda, vecino).
    limits:
      pan:  [40, 140]
      tilt: [25, 80]
    rest_angles: [90, 60]      # posición de reposo
  luz:
    type: relay
    pin: 17                    # numeración BCM
    active_high: true
    max_on_s: 10
  aspersor:                    # aspersor fijo de respaldo (cubre lo que la torreta no)
    type: relay
    pin: 5
    active_high: true
    max_on_s: 6                # tope duro: la electroválvula nunca queda abierta más
    pulse_on_s: 1.0
    pulse_off_s: 0.5
  ultrasonido:
    type: relay
    pin: 22
    active_high: true
    max_on_s: 10
  sonido:
    type: sound
    files: [sounds/hiss.wav, sounds/air.wav]
    player: aplay              # aplay | paplay | ffplay

sensors:
  # Opcional: flotador del estanque cuando el agua no viene de la red.
  # Vacío = los disuasores en `gates` no se activan y llega un aviso.
  # nivel_estanque:
  #   type: float_switch
  #   pin: 16
  #   empty_when: low
  #   gates: [torreta]

events:
  log_file: data/events.jsonl
  snapshots_dir: data/snapshots
  save_snapshots: true

notify:
  telegram:
    enabled: false
    token: ""
    chat_id: ""
